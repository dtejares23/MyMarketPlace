services:
  db:
    image: postgres:15-alpine
    container_name: mymarketplace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mymarketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: mymarketplace-cache
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: mymarketplace-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://avnadmin:AVNS_1-TTYC3zUI_yQKDpGwI@pg-dtejares-acknowledgement-receipt-generator.e.aivencloud.com:10088/MyMarketPlace?sslmode=require
      - REDIS_HOST=cache
      - JWT_SECRET=supersecretkey123
    restart: on-failure
    depends_on:
      - cache

  storefront:
    build: ./frontend
    container_name: mymarketplace-storefront
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - api

  admin:
    build: ./admin
    container_name: mymarketplace-admin
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  pgdata: